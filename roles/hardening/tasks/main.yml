---
# tasks file for roles/hardening
- name: Configurer le port SSH
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Port '
    line: "Port {{ hardening_ssh_port }}"
  notify: Redémarrer SSH

- name: Désactiver l'authentification par mot de passe
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PasswordAuthentication '
    line: "PasswordAuthentication no"
  notify: Redémarrer SSH

- name: Désactiver la connexion root
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?PermitRootLogin '
    line: "PermitRootLogin no"
  notify: Redémarrer SSH

- name: Limiter le nombre de tentatives d'authentification
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?MaxAuthTries '
    line: "MaxAuthTries 3"
  notify: Redémarrer SSH

- name: Installer UFW
  ansible.builtin.apt:
    name: ufw
    state: present

- name: Politique par défaut - refuser les connexions entrantes
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Politique par défaut - autoriser les connexions sortantes
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Autoriser le port SSH
  community.general.ufw:
    rule: allow
    port: "{{ hardening_ssh_port | string }}"
    proto: tcp

- name: Activer UFW
  community.general.ufw:
    state: enabled
# ============================
# CIS Benchmark - Mises à jour automatiques
# ============================
- name: Installer unattended-upgrades
  ansible.builtin.apt:
    name: unattended-upgrades
    state: present

- name: Activer les mises à jour automatiques
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: '0644'

# ============================
# CIS Benchmark - Services inutiles
# ============================
- name: Désactiver et arrêter les services inutiles
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop: "{{ hardening_unnecessary_services }}"
  register: hardening_service_result
  failed_when:
    - hardening_service_result.failed is defined
    - hardening_service_result.failed
    - "'Could not find the requested service' not in hardening_service_result.msg | default('')"
# ============================
# CIS Benchmark - auditd (traçabilité)
# ============================
- name: Installer auditd
  ansible.builtin.apt:
    name:
      - auditd
      - audispd-plugins
    state: present

- name: Démarrer et activer auditd
  ansible.builtin.systemd:
    name: auditd
    state: started
    enabled: true

- name: Déployer les règles auditd de durcissement
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/hardening.rules
    content: |
      # Surveillance des fichiers sensibles
      -w /etc/passwd -p wa -k identity
      -w /etc/shadow -p wa -k identity
      -w /etc/group -p wa -k identity
      -w /etc/sudoers -p wa -k scope
      -w /etc/ssh/sshd_config -p wa -k sshd_config

      # Surveillance des commandes sudo
      -w /usr/bin/sudo -p x -k privileged_commands

      # Surveillance de la configuration réseau
      -w /etc/hosts -p wa -k network_config
      -w /etc/network/ -p wa -k network_config
    owner: root
    group: root
    mode: '0640'
  notify: Recharger les règles auditd
# ============================
# CIS Benchmark - AIDE (intégrité des fichiers)
# ============================
- name: Installer AIDE
  ansible.builtin.apt:
    name:
      - aide
      - aide-common
    state: present

- name: Vérifier si la base AIDE existe déjà
  ansible.builtin.stat:
    path: /var/lib/aide/aide.db
  register: hardening_aide_db

- name: Initialiser la base AIDE (si absente)
  ansible.builtin.command: aideinit -y -f
  when: not hardening_aide_db.stat.exists
  changed_when: true

- name: Déployer le script de vérification quotidienne AIDE
  ansible.builtin.copy:
    dest: /etc/cron.daily/aide-check
    content: |
      #!/bin/bash
      /usr/bin/aide --config /etc/aide/aide.conf --check > /var/log/aide/aide-check-$(date +\%Y\%m\%d).log 2>&1
    owner: root
    group: root
    mode: '0755'

- name: Créer le répertoire de logs AIDE
  ansible.builtin.file:
    path: /var/log/aide
    state: directory
    owner: root
    group: root
    mode: '0750'
