apiVersion: v1
kind: Namespace
metadata:
  name: wazuh-ml
---
apiVersion: v1
kind: Secret
metadata:
  name: wazuh-indexer-credentials
  namespace: wazuh-ml
type: Opaque
stringData:
  WAZUH_INDEXER_URL: "https://192.168.56.105:9200"
  WAZUH_INDEXER_USER: "admin"
  WAZUH_INDEXER_PASSWORD: "REMPLACE_MOI_AVEC_LE_VRAI_MOT_DE_PASSE"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wazuh-ml-dashboard
  namespace: wazuh-ml
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wazuh-ml-dashboard
  template:
    metadata:
      labels:
        app: wazuh-ml-dashboard
    spec:
      containers:
      - name: wazuh-ml-dashboard
        image: wazuh-ml-dashboard:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: wazuh-indexer-credentials
        env:
        - name: HISTORY_DAYS
          value: "14"
        - name: REFRESH_INTERVAL_SECONDS
          value: "300"
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: wazuh-ml-dashboard-svc
  namespace: wazuh-ml
spec:
  selector:
    app: wazuh-ml-dashboard
  ports:
  - port: 80
    targetPort: 8000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wazuh-ml-dashboard-ingress
  namespace: wazuh-ml
  annotations:
    cert-manager.io/cluster-issuer: selfsigned-issuer
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - wazuh-ml.lab.local
    secretName: wazuh-ml-dashboard-tls
  rules:
  - host: wazuh-ml.lab.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: wazuh-ml-dashboard-svc
            port:
              number: 80
